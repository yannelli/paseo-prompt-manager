<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Prompt Manager promo images</title><link rel="stylesheet" href="brand.css"><style>
    body{overflow:auto;padding:48px;background:var(--ink);color:#f2f3fb}header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:24px;margin-bottom:36px}
    h1{font-size:30px;letter-spacing:-.02em}p{margin:6px 0 0;color:#a3a8c7}nav{display:flex;gap:8px}
    button{border:1px solid rgba(179,169,255,.3);border-radius:999px;background:transparent;color:inherit;padding:10px 18px;font:inherit;cursor:pointer}button[aria-pressed=true]{background:var(--violet);border-color:var(--violet)}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:28px}figure{margin:0}img{width:100%;display:block;border-radius:12px;box-shadow:0 0 0 1px rgba(179,169,255,.2)}
    figcaption{padding:10px 0;font:14px 'JetBrains Mono',monospace;color:#a3a8c7}body[data-theme=dark] .light,body[data-theme=light] .dark{display:none}
    @media(max-width:800px){body{padding:16px}.grid{grid-template-columns:1fr}}</style></head>
    <body data-theme="both"><header><div><div class="brand" style="font-size:22px"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-hidden="true">
  <rect x="22" y="4" width="36" height="44" rx="8" fill="#b3a9ff"/>
  <rect x="14" y="10" width="36" height="44" rx="8" fill="#8f82ff"/>
  <rect x="6" y="16" width="36" height="44" rx="8" fill="#6d5efc"/>
  <path d="M15 31l7 6-7 6" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M27 43h8" fill="none" stroke="#ffc04d" stroke-width="4.5" stroke-linecap="round"/>
</svg>
<div>Prompt Manager <span>/ Paseo</span></div></div><p>1920 × 1080 · Plugin UI illustrations with sample data</p></div>
    <nav aria-label="Theme"><button data-theme="both" aria-pressed="true">Both</button><button data-theme="dark" aria-pressed="false">Dark</button><button data-theme="light" aria-pressed="false">Light</button></nav></header>
    <main class="grid"><figure class="dark"><a href="dark/library.png"><img src="dark/library.png" alt="prompt library, dark theme"></a><figcaption>prompt library · dark</figcaption></figure><figure class="light"><a href="light/library.png"><img src="light/library.png" alt="prompt library, light theme"></a><figcaption>prompt library · light</figcaption></figure><figure class="dark"><a href="dark/composer.png"><img src="dark/composer.png" alt="agent composer, dark theme"></a><figcaption>agent composer · dark</figcaption></figure><figure class="light"><a href="light/composer.png"><img src="light/composer.png" alt="agent composer, light theme"></a><figcaption>agent composer · light</figcaption></figure><figure class="dark"><a href="dark/history.png"><img src="dark/history.png" alt="version history, dark theme"></a><figcaption>version history · dark</figcaption></figure><figure class="light"><a href="light/history.png"><img src="light/history.png" alt="version history, light theme"></a><figcaption>version history · light</figcaption></figure><figure class="dark"><a href="dark/import.png"><img src="dark/import.png" alt="import, dark theme"></a><figcaption>import · dark</figcaption></figure><figure class="light"><a href="light/import.png"><img src="light/import.png" alt="import, light theme"></a><figcaption>import · light</figcaption></figure><figure class="dark"><a href="dark/git-sync.png"><img src="dark/git-sync.png" alt="git sync, dark theme"></a><figcaption>git sync · dark</figcaption></figure><figure class="light"><a href="light/git-sync.png"><img src="light/git-sync.png" alt="git sync, light theme"></a><figcaption>git sync · light</figcaption></figure></main>
    <script>document.querySelectorAll('button').forEach((button)=>button.addEventListener('click',()=>{document.body.dataset.theme=button.dataset.theme;document.querySelectorAll('button').forEach((item)=>item.setAttribute('aria-pressed',String(item===button)))}));</script></body></html>
