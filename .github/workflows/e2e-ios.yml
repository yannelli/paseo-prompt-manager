name: E2E iOS

on:
  pull_request:
  push:
    branches: [main, beta]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-ios-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # macOS temp dirs sit behind the /var symlink, which the plugin refuses as a library path.
  PROMPT_E2E_TMP: /Users/runner/work/_temp
  MAESTRO_VERSION: 2.11.0
  MAESTRO_SHA256: 5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a
  IOS_BUNDLE_ID: sh.paseo

jobs:
  ios:
    name: iOS simulator (Maestro)
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve versions
        id: ver
        run: |
          paseo="$(node -p "require('./package.json').devDependencies['@getpaseo/cli']")"
          xcode="$(xcodebuild -version | tr '\n' ' ' | tr -s ' ' | sed 's/ $//; s/ /-/g')"
          echo "paseo=$paseo" >> "$GITHUB_OUTPUT"
          echo "xcode=$xcode" >> "$GITHUB_OUTPUT"

      - name: Restore simulator app
        id: app-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/paseo-app
          key: paseo-ios-app-${{ steps.ver.outputs.paseo }}-${{ steps.ver.outputs.xcode }}-${{ hashFiles('e2e/ios/build-app.sh') }}

      - name: Node for the Paseo build
        if: steps.app-cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Build Paseo for the iOS simulator
        if: steps.app-cache.outputs.cache-hit != 'true'
        run: e2e/ios/build-app.sh "${{ steps.ver.outputs.paseo }}" "${{ runner.temp }}/paseo-app"

      - name: Save simulator app
        if: steps.app-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/paseo-app
          key: ${{ steps.app-cache.outputs.cache-primary-key }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Maestro
        run: |
          curl -fsSL "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip" -o "$RUNNER_TEMP/maestro.zip"
          echo "$MAESTRO_SHA256  $RUNNER_TEMP/maestro.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/maestro/bin" >> "$GITHUB_PATH"

      - name: Boot simulator and install app
        run: |
          udid="$(xcrun simctl list devices available -j | node -e '
            const d = JSON.parse(require("fs").readFileSync(0, "utf8")).devices;
            const runtimes = Object.keys(d).filter((k) => k.includes("iOS")).sort();
            for (const r of runtimes.reverse()) {
              const m = d[r].find((x) => /^iPhone 16( |$)/.test(x.name) && !/Plus|Pro|e/.test(x.name.replace("iPhone 16","")));
              if (m) { console.log(m.udid); break; }
            }')"
          test -n "$udid" || { xcrun simctl list devices available; exit 1; }
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
          # The soft keyboard only shows when the simulator does not use the Mac keyboard.
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          xcrun simctl bootstatus "$udid" -b
          app="$(ls -d "$RUNNER_TEMP"/paseo-app/*.app | head -1)"
          xcrun simctl install "$udid" "$app"
          xcrun simctl get_app_container "$udid" "$IOS_BUNDLE_ID"

      - name: Smoke and probe
        continue-on-error: true
        run: |
          maestro --version
          node e2e/ios/smoke.ts

      - name: Run the iOS E2E suite
        timeout-minutes: 30
        run: bash e2e/mobile/ci-run.sh
        env:
          PROMPT_E2E_PLATFORM: ios
          PROMPT_E2E_APP_ID: ${{ env.IOS_BUNDLE_ID }}
          PROMPT_E2E_DEVICE: ${{ env.SIM_UDID }}
          # Narrow a debugging run to scenarios whose title matches.
          PROMPT_E2E_PATTERN: "focused editor field"

      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-ios-results
          path: |
            e2e/.results/
            /Users/runner/.maestro/tests/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: ignore

