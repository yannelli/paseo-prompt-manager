appId: sh.paseo
---
- runFlow: lib/open-library.yaml
- assertVisible: Open Code review
- assertVisible: Open Blog post
- assertVisible: Open Changelog

# Search
- tapOn: Search prompts
- inputText: launch
# The keyboard would hide the rows below the first.
- hideKeyboard
- extendedWaitUntil:
    notVisible: Open Code review
    timeout: 15000
- assertVisible: Open Blog post
- assertNotVisible: Open Changelog
- tapOn: Clear search
- extendedWaitUntil:
    visible: Open Code review
    timeout: 15000

# Folder
- tapOn: All folders
- tapOn: Select folder writing
- extendedWaitUntil:
    notVisible: Open Code review
    timeout: 15000
- assertVisible: Open Blog post
- assertVisible: Open Changelog
- takeScreenshot: filters-folder
- tapOn: Clear filters
- extendedWaitUntil:
    visible: Open Code review
    timeout: 15000

# Tag
- tapOn: release
- extendedWaitUntil:
    notVisible: Open Code review
    timeout: 15000
- assertVisible: Open Changelog
- assertNotVisible: Open Blog post
- takeScreenshot: filters-tag
