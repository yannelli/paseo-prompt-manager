appId: sh.paseo
---
# Fresh install: welcome screen -> direct connection form -> host added -> home screen.
- launchApp:
    clearState: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible:
      id: welcome-screen
    timeout: 120000
- takeScreenshot: connect-01-welcome
- tapOn:
    id: welcome-direct-connection
- extendedWaitUntil:
    visible:
      id: add-host-modal
    timeout: 15000
- tapOn:
    id: direct-host-input
- eraseText
- inputText: ${HOST}
- tapOn:
    id: direct-port-input
- eraseText
- inputText: ${PORT}
- assertVisible:
    id: direct-host-input
    text: ${HOST}
- assertVisible:
    id: direct-port-input
    text: ${PORT}
- takeScreenshot: connect-02-form
- tapOn:
    id: direct-host-submit
- extendedWaitUntil:
    visible:
      id: menu-button
    timeout: 90000
- takeScreenshot: connect-03-home
