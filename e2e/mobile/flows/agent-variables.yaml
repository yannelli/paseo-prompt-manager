appId: sh.paseo
---
- runFlow: lib/open-agent.yaml
- tapOn: Send a saved prompt
- extendedWaitUntil:
    visible: Send Clean up
    timeout: 30000
- tapOn: Send Clean up
# The picker turns into a form with one field per variable; person keeps its default, me.
- extendedWaitUntil:
    visible: Value for module
    timeout: 20000
- waitForAnimationToEnd
- assertVisible: Value for person
- takeScreenshot: variables-form
- tapOn: Value for module
- inputText: server/git.ts
# Submitting a single-line field ends editing on both platforms, without closing the sheet.
- pressKey: Enter
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: Send filled prompt
    timeout: 15000
- takeScreenshot: variables-filled
- tapOn: Send filled prompt
# The runner checks what the agent received; the sent message in the timeline stays.
- extendedWaitUntil:
    notVisible: Send filled prompt
    timeout: 20000
- extendedWaitUntil:
    visible: ".*Take a look at server/git\\.ts, remove dead code, and assign the review to me\\..*"
    timeout: 30000
- takeScreenshot: variables-sent
