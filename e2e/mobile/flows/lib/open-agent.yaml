appId: sh.paseo
---
# Opens the agent screen through the app's deep link. The phone layout only hydrates the
# workspace list once the drawer has been opened, and the agent route waits for it.
- runFlow: launch.yaml
- tapOn:
    id: menu-button
- extendedWaitUntil:
    visible:
      id: sidebar-project-list
    timeout: 60000
- takeScreenshot: open-agent-drawer
- tapOn:
    id: sidebar-close
- waitForAnimationToEnd
- openLink: paseo:///h/${SERVER_ID}/agent/${AGENT_ID}
# iOS asks before a custom URL scheme opens the app.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: Open
- extendedWaitUntil:
    visible: Send a saved prompt
    timeout: 90000
