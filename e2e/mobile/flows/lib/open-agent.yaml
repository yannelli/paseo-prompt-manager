appId: sh.paseo
---
# Opens the agent screen through the app's deep link. The phone layout only hydrates the
# workspace list once the drawer has been opened, and the agent route waits for it.
- runFlow: launch.yaml
- tapOn:
    id: menu-button
- extendedWaitUntil:
    visible:
      id: sidebar-project-list
    timeout: 60000
- takeScreenshot: open-agent-drawer
- tapOn:
    id: sidebar-close
- waitForAnimationToEnd
- openLink: paseo:///h/${SERVER_ID}/agent/${AGENT_ID}
# iOS asks once per install before a custom URL scheme opens the app; the alert takes a moment to appear.
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: Open in.*
          timeout: 10000
          optional: true
      - runFlow:
          when:
            visible: Open in.*
          commands:
            - tapOn: Open
- extendedWaitUntil:
    visible: Send a saved prompt
    timeout: 90000
