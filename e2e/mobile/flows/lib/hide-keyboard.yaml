appId: sh.paseo
---
# iOS only. The keyboard stays up while the next field scrolls into view, and Maestro counts a field
# behind the keys as visible, so the tap lands on a key. Android resizes the window, so it needs nothing.
# Multiline fields have no dismissing return key; the editor's "Hide keyboard" button does it while on screen.
- runFlow:
    when:
      platform: iOS
      visible: Hide keyboard
    commands:
      - tapOn: Hide keyboard
      - waitForAnimationToEnd
- runFlow:
    when:
      platform: iOS
      visible: return
    commands:
      - hideKeyboard
