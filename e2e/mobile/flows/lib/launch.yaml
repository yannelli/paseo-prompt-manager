appId: sh.paseo
---
# Restarts the installed app (data kept) and waits for a connected screen. With no projects the
# home route is the open-project screen, which has the header menu button but no composer.
- launchApp:
    permissions:
      all: allow
- runFlow:
    when:
      platform: Android
    commands:
      - runFlow: dismiss-anr.yaml
# A deep link alert left by an earlier flow stays over the relaunched app and hides it.
- runFlow:
    when:
      platform: iOS
    commands:
      - repeat:
          times: 3
          while:
            visible: Open in.*
          commands:
            - tapOn: Cancel
            - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: menu-button
    timeout: 90000
