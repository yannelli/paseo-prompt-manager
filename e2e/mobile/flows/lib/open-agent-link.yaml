appId: sh.paseo
---
- openLink: paseo:///h/${SERVER_ID}/agent/${AGENT_ID}
# iOS asks before a custom URL scheme opens the app, and the alert can take most of a minute to appear.
# A link sent again while it is pending queues a second alert that outlives the app, so keep
# answering alerts until the agent screen shows instead.
- runFlow:
    when:
      platform: iOS
    commands:
      - repeat:
          times: 12
          while:
            notVisible: Send a saved prompt
          commands:
            - runFlow:
                when:
                  visible: Open in.*
                commands:
                  - tapOn: Open
            - extendedWaitUntil:
                visible: Send a saved prompt
                timeout: 5000
                optional: true
