# Temporary iOS pipeline smoke; removed once the shared mobile suite runs on iOS.
appId: sh.paseo
---
- runFlow: ../mobile/flows/connect.yaml
- extendedWaitUntil:
    visible:
      id: "menu-button"
    timeout: 90000
- tapOn:
    id: "menu-button"
- tapOn:
    id: "plugin-sidebar-paseo-prompt-manager-library"
- extendedWaitUntil:
    visible:
      id: "prompt-library"
    timeout: 30000
- assertVisible: "Open Smoke prompt"
